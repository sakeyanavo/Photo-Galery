@if (photo(); as photo) {
  <section class="flex min-h-[calc(100vh-64px)] flex-col items-center gap-4 bg-black px-6 py-4">
    <div class="flex w-full justify-between">
      <a mat-button routerLink="/favorites" class="text-white!">
        <mat-icon>arrow_back</mat-icon>
        Favorites
      </a>
      <button mat-flat-button type="button" (click)="remove()">
        <mat-icon>favorite</mat-icon>
        Remove from favorites
      </button>
    </div>
    <img [src]="photo.url" alt="" class="max-h-[calc(100vh-64px-6rem)] max-w-full" />
  </section>
} @else {
  <section class="mx-auto max-w-6xl p-6">
    <h1 class="mb-4 text-3xl font-bold">Photo not found</h1>
    <p>This photo is not in your favorites. <a routerLink="/favorites" class="underline">Go to favorites</a></p>
  </section>
}
