<div class="card">
  <button type="button" class="card__photo" (click)="selected.emit(photo())">
    <img [src]="photo().url" alt="" loading="lazy" />
  </button>

  <button
    type="button"
    class="card__heart"
    [class.card__heart--active]="favorite()"
    [attr.aria-label]="favorite() ? 'Remove from favorites' : 'Add to favorites'"
    (click)="favoriteToggled.emit(photo())">
    <mat-icon>{{ favorite() ? 'favorite' : 'favorite_border' }}</mat-icon>
  </button>
</div>
