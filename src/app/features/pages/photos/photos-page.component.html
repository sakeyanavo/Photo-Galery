<section class="mx-auto max-w-6xl p-6">
  <h1 class="mb-4 text-3xl font-bold">Photos</h1>

  <div class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-4">
    @for (photo of photos(); track photo.id) {
      <app-photo-card
        [photo]="photo"
        [favorite]="favorites.isFavorite(photo.id)"
        (selected)="toggleFavorite($event)"
        (favoriteToggled)="toggleFavorite($event)" />
    }
  </div>

  @if (loading()) {
    <mat-progress-spinner class="mx-auto my-8" mode="indeterminate" [diameter]="40" />
  } @else {
    <!-- Re-created after every batch so the observer fires again if it is still on screen. -->
    <div appInfiniteScroll (reached)="loadMore()"></div>
  }
</section>
