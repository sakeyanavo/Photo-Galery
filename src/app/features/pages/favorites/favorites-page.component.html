<section class="mx-auto max-w-6xl p-6">
  <h1 class="mb-4 text-3xl font-bold">Favorites</h1>

  @if (favorites.photos().length === 0) {
    <p>No favorites yet. <a routerLink="/" class="underline">Browse photos</a> and tap the heart on the ones you like.</p>
  }

  <div class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-4">
    @for (photo of favorites.photos(); track photo.id) {
      <app-photo-card
        [photo]="photo"
        [favorite]="true"
        (selected)="open($event)"
        (favoriteToggled)="favorites.remove($event.id)" />
    }
  </div>
</section>
