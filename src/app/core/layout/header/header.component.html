<mat-toolbar class="header">
  <a class="header__brand" routerLink="/" aria-label="Photo Library home">
    <mat-icon class="is-filled" aria-hidden="true">photo_camera</mat-icon>
    <span class="header__brand-text">Photo Library</span>
  </a>

  <nav class="header__nav" aria-label="Main">
    @for (item of navItems; track item.path) {
      <a
        class="header__link"
        [routerLink]="item.path"
        [attr.aria-label]="item.label"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        ariaCurrentWhenActive="page">
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span class="header__link-label">{{ item.label }}</span>
      </a>
    }
  </nav>
</mat-toolbar>
